[SystemSettings]
; Frame pacing previsivel.
t.MaxFPS=45
r.VSync=0
r.OneFrameThreadLag=1
r.RHICmdBypass=0

; PSO precache. StartupMode=Fast trabalha junto do NWStartupWarmupDirector:
; compilamos o maximo possivel atras da tela de carregamento e depois mudamos
; para Background durante gameplay. O cache do usuario e salvo para proximas rodadas.
r.PSOPrecaching=1
r.PSOPrecache.Components=1
r.PSOPrecache.Resources=1
r.PSOPrecache.ProxyCreationWhenPSOReady=1
r.PSOPrecache.ProxyCreationDelayStrategy=1
r.PSOPrecache.GlobalShaders=1
r.PSOPrecaching.WaitForHighPriorityRequestsOnly=0
r.PSOPrecache.Validation=1
r.ShaderPipelineCache.Enabled=1
r.ShaderPipelineCache.StartupMode=1
r.ShaderPipelineCache.BatchSize=64
r.ShaderPipelineCache.BackgroundBatchSize=2
r.ShaderPipelineCache.LogPSO=1
r.ShaderPipelineCache.SaveAfterPSOsLogged=50

; Ceu premium: light shafts, nuvens e fog volumetrico sao GPU-friendly e criam
; os raios de sol pedidos sem transferir mais simulacao para o Game Thread.
r.SkyAtmosphere=1
r.VolumetricCloud=1
r.VolumetricFog=1
r.LightShaftQuality=1
r.BloomQuality=4

; Qualidade premium moderada. RTX recebe mais trabalho; CPU continua protegida.
r.ScreenPercentage=100
r.ShadowQuality=3
r.PostProcessQuality=3
r.EffectsQuality=3
r.TextureQuality=3
r.Streaming.PoolSize=4600
r.TextureStreaming=1

; Natureza real em HISM, com densidade controlada para evitar draw/CPU excessivo.
r.ViewDistanceScale=0.68
foliage.DensityScale=0.60
grass.DensityScale=0.48
r.FoliageQuality=3

; Carregamento assincrono reduz picos do Game Thread. O launcher V4 tambem faz
; DerivedDataCache -fill antes de abrir o jogo quando o commit ainda nao foi aquecido.
s.AsyncLoadingThreadEnabled=1
s.EventDrivenLoaderEnabled=1

