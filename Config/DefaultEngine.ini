[SystemSettings]
; Frame pacing previsivel.
t.MaxFPS=45
r.VSync=0
r.OneFrameThreadLag=1
r.RHICmdBypass=0

; O log do playtest mostrou 100 PSO hitches e zero precache. Estas opcoes pedem
; ao renderer para preparar PSOs/componentes antes da primeira renderizacao sempre
; que o caminho de shader suportar precache, reduzindo travadas na primeira habilidade.
r.PSOPrecaching=1
r.PSOPrecache.Components=1
r.PSOPrecache.Resources=1
r.PSOPrecache.ProxyCreationWhenPSOReady=1
r.ShaderPipelineCache.Enabled=1

; Qualidade na GPU sem pressionar o Render Thread.
r.ScreenPercentage=100
r.ShadowQuality=2
r.PostProcessQuality=2
r.EffectsQuality=2
r.TextureQuality=3
r.Streaming.PoolSize=4600
r.TextureStreaming=1

; Reduz culling/submit de objetos distantes.
r.ViewDistanceScale=0.60
foliage.DensityScale=0.55
grass.DensityScale=0.40
r.FoliageQuality=2

; Carregamento assincrono reduz picos do Game Thread.
s.AsyncLoadingThreadEnabled=1
s.EventDrivenLoaderEnabled=1

