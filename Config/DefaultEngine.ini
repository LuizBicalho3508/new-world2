[SystemSettings]
; Frame pacing previsivel. Frame Generation pode multiplicar os frames apresentados
; sem elevar na mesma proporcao o tick do jogo.
t.MaxFPS=45
r.VSync=0
r.OneFrameThreadLag=1
r.RHICmdBypass=0

; PSO precache V5. Esperamos apenas PSOs prioritarios no loading curto; o restante
; continua em Background. Isso evita repetir a espera de mais de uma hora causada
; por um DDC -fill de todo o Content.
r.PSOPrecaching=1
r.PSOPrecache.Components=1
r.PSOPrecache.Resources=1
r.PSOPrecache.ProxyCreationWhenPSOReady=1
r.PSOPrecache.ProxyCreationDelayStrategy=1
r.PSOPrecache.GlobalShaders=1
r.PSOPrecaching.WaitForHighPriorityRequestsOnly=1
r.PSOPrecache.Validation=1
r.ShaderPipelineCache.Enabled=1
r.ShaderPipelineCache.StartupMode=1
r.ShaderPipelineCache.BatchSize=32
r.ShaderPipelineCache.BackgroundBatchSize=2
r.ShaderPipelineCache.LogPSO=1
r.ShaderPipelineCache.SaveAfterPSOsLogged=50

; Ceu premium: light shafts, nuvens e fog volumetrico usam a RTX durante gameplay.
r.SkyAtmosphere=1
r.VolumetricCloud=1
r.VolumetricFog=1
r.LightShaftQuality=1
r.BloomQuality=4

; Qualidade premium moderada. Se DLSS estiver ativo, o diretor NVIDIA muda o
; ScreenPercentage para um alvo equivalente a Quality; sem DLSS mantemos 100% TSR.
r.ScreenPercentage=100
r.ShadowQuality=3
r.PostProcessQuality=3
r.EffectsQuality=3
r.TextureQuality=3
r.Streaming.PoolSize=4600
r.TextureStreaming=1

; Natureza real em HISM, com densidade controlada para evitar draw/CPU excessivo.
r.ViewDistanceScale=0.68
foliage.DensityScale=0.60
grass.DensityScale=0.48
r.FoliageQuality=3

; Carregamento assincrono. O launcher V5 nao executa DDC full por padrao; ele
; reutiliza o cache existente e oferece --full-ddc com tempo maximo quando desejado.
s.AsyncLoadingThreadEnabled=1
s.EventDrivenLoaderEnabled=1

