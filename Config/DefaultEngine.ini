[SystemSettings]
; Frame cap moderado: evita que a CPU tente produzir frames que o Render Thread nao acompanha.
t.MaxFPS=45
r.VSync=0
r.OneFrameThreadLag=1
r.RHICmdBypass=0

; Qualidade mantida onde a RTX consegue absorver o custo sem pressionar a CPU.
r.ScreenPercentage=100
r.ShadowQuality=2
r.PostProcessQuality=2
r.EffectsQuality=3
r.TextureQuality=3
r.Streaming.PoolSize=4600
r.TextureStreaming=1

; Reduz trabalho de culling/submit no Render Thread e excesso visual no prototipo.
r.ViewDistanceScale=0.60
foliage.DensityScale=0.55
grass.DensityScale=0.40
r.FoliageQuality=2

; Carregamento assincrono reduz picos do Game Thread.
s.AsyncLoadingThreadEnabled=1
s.EventDrivenLoaderEnabled=1

